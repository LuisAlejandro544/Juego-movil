name: Filtrar OneLife para Móvil (Offline)

on:
  workflow_dispatch: # Te permite activar el proceso manualmente con un botón en GitHub
  schedule:
    - cron: '0 0 * * 1' # Se ejecuta automáticamente todos los lunes para buscar actualizaciones

jobs:
  filtrar_codigo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Clonar mi propio repositorio
        uses: actions/checkout@v4

      - name: 2. Clonar el repositorio original de OneLife
        run: |
          git clone --depth 1 https://github.com original_repo

      - name: 3. Limpiar y mover solo lo importante (gameSource)
        run: |
          # Eliminar versiones viejas de gameSource si existen en tu repo para no duplicar
          rm -rf gameSource
          
          # Copiar la carpeta limpia del juego original a tu repositorio
          cp -r original_repo/gameSource ./gameSource
          
          # Eliminar la descarga completa del original para limpiar espacio
          rm -rf original_repo

      - name: 4. Subir los cambios a mi repositorio
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add gameSource/
          
          # Verificar si hay cambios reales antes de hacer el commit (evita errores si todo sigue igual)
          if ! git diff --cached --quiet; then
            git commit -m "Sincronización automática de gameSource desde el repo oficial"
            git push
          else
            echo "No hay cambios nuevos en gameSource."
          fi
          
